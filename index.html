    <script>
      // Aplica o tema (claro/escuro) antes da app carregar, para evitar um
      // "flash" do tema errado por uma fracção de segundo.
      (function () {
        var guardado = localStorage.getItem("atsc-tema");
        var escuro = guardado === "dark" || (!guardado && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (escuro) document.documentElement.classList.add("dark");
      })();
    </script>
